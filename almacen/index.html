<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXUS · Almacenamiento</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);--accent:#7c3aed;--accent2:#06b6d4;--text:#e2e8f0;--muted:#94a3b8}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;padding:1.5rem 2rem;display:flex;flex-direction:column}
.header{text-align:center;margin-bottom:1.5rem;animation:fadeUp .6s ease both}
.logo{font-size:.7rem;letter-spacing:5px;text-transform:uppercase;color:var(--accent2);margin-bottom:.4rem;font-weight:600}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;background:linear-gradient(135deg,#fff 30%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.toolbar{display:flex;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.btn{padding:.6rem 1.2rem;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px -4px rgba(124,58,237,.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px -4px rgba(124,58,237,.5)}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:rgba(124,58,237,.4);transform:translateY(-1px)}
.breadcrumb{display:flex;align-items:center;gap:.3rem;margin-bottom:1rem;font-size:.9rem;flex-wrap:wrap}
.crumb{color:var(--accent2);cursor:pointer;padding:.2rem .5rem;border-radius:6px;transition:background .2s}
.crumb:hover{background:rgba(6,182,212,.1)}
.crumb.current{color:#fff;font-weight:700;pointer-events:none}
.sep{color:var(--muted);font-size:.8rem}
.dropzone{border:2px dashed rgba(124,58,237,.3);border-radius:16px;padding:2.5rem 1.5rem;text-align:center;margin-bottom:1.5rem;transition:all .3s;cursor:pointer;display:none}
.dropzone.active{display:block;border-color:var(--accent);background:rgba(124,58,237,.06)}
.dropzone.dragover{border-color:var(--accent2);background:rgba(6,182,212,.08);transform:scale(1.01)}
.dz-icon{font-size:2.5rem;margin-bottom:.5rem}
.dz-text{color:var(--muted);font-size:.95rem}
.file-list{display:flex;flex-direction:column;gap:.4rem}
.file-item{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:.75rem;padding:.85rem 1.2rem;background:var(--card);border:1px solid var(--border);border-radius:12px;transition:all .2s;animation:fadeUp .4s ease both}
.file-item:hover{border-color:rgba(124,58,237,.3);transform:translateX(4px)}
.fi-icon{font-size:1.4rem;width:2.2rem;text-align:center}
.fi-name{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi-size{color:var(--muted);font-size:.82rem;min-width:5rem;text-align:right}
.fi-date{color:#475569;font-size:.78rem;min-width:10rem;text-align:right}
.fi-actions{display:flex;gap:.3rem}
.act-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem;background:rgba(255,255,255,.06);border:1px solid transparent;cursor:pointer;transition:all .2s}
.act-btn:hover{background:rgba(124,58,237,.15);border-color:rgba(124,58,237,.3)}
.act-btn.danger:hover{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3)}
.progress-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-bottom:.75rem;display:none}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s;border-radius:2px}
.toast-container{position:fixed;bottom:1.5rem;right:1.5rem;display:flex;flex-direction:column;gap:.5rem;z-index:999}
.toast{padding:.75rem 1.2rem;border-radius:10px;font-size:.88rem;font-weight:600;animation:slideIn .3s ease both;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
.toast-success{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#6ee7b7}
.toast-error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.empty-state{text-align:center;padding:3rem;color:var(--muted)}
.empty-icon{font-size:3rem;margin-bottom:.75rem;opacity:.4}
.err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:1rem;margin-bottom:1rem;color:#fca5a5;font-size:.9rem}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:600px){.file-item{grid-template-columns:auto 1fr auto}.fi-date,.fi-size{display:none}}
</style>
</head>
<body>

<header class="header">
<p class="logo">NEXUS · Almacenamiento</p>
<h1>Gestor de Archivos</h1>
</header>

<div id="errBox" class="err-box" style="display:none"></div>
<div class="breadcrumb" id="breadcrumb"></div>

<div class="toolbar">
<button class="btn btn-primary" onclick="triggerUpload()">⬆️ Subir archivos</button>
<button class="btn btn-ghost" onclick="promptMkdir()">📁 Nueva carpeta</button>
<input type="file" id="fileInput" multiple style="display:none">
</div>

<div class="progress-bar" id="progBar"><div class="progress-fill" id="progFill"></div></div>

<div class="dropzone active" id="dropZone">
<div class="dz-icon">📂</div>
<p class="dz-text">Arrastra archivos aquí o haz clic para seleccionar</p>
</div>

<div class="file-list" id="fileList"><p style="color:var(--muted)">Cargando…</p></div>

<div class="toast-container" id="toasts"></div>

<script>


// ─── ERROR HANDLER GLOBAL ──────────────────────────────
window.onerror = function(msg, url, line, col) {
    var box = document.getElementById('errBox');
    box.style.display = 'block';
    box.textContent = '⚠️ Error JS: ' + msg + ' (línea ' + line + ', col ' + col + ')';
    return false;
};

// ─── CONSTANTES ──────────────────────────────────────
var API = 'api.php';
var currentPath = '';

function esc(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function toast(msg, isError) {
    var el = document.createElement('div');
    el.className = 'toast ' + (isError ? 'toast-error' : 'toast-success');
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(function(){ el.remove(); }, 4000);
}

// ─── CARGAR DIRECTORIO ──────────────────────────────
function loadDir(path) {
    currentPath = path || '';
    var url = API + '?action=list&path=' + encodeURIComponent(currentPath);
    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data.ok) { toast(data.error || 'Error de API', true); return; }
            renderBreadcrumb(currentPath);
            renderList(data.items);
        })
        .catch(function(e) {
            var box = document.getElementById('errBox');
            box.style.display = 'block';
            box.textContent = '⚠️ Error fetch: ' + e.message;
        });
}

// ─── BREADCRUMB ──────────────────────────────────────
function renderBreadcrumb(path) {
    var bc = document.getElementById('breadcrumb');
    var html = '<a class="crumb" onclick="loadDir(\'\')">🏠 Raíz</a>';
    if (!path) { bc.innerHTML = html; return; }
    var parts = path.split('/').filter(Boolean);
    var acc = '';
    for (var i = 0; i < parts.length; i++) {
        acc += (acc ? '/' : '') + parts[i];
        var isLast = (i === parts.length - 1);
        html += '<span class="sep">/</span><a class="crumb' + (isLast ? ' current' : '') + '" onclick="loadDir(\'' + esc(acc) + '\')">' + parts[i] + '</a>';
    }
    bc.innerHTML = html;
}

// ─── FORMATO TAMAÑO ──────────────────────────────
function fmtSize(b) {
    if (!b || b === 0) return '';
    var u = ['B','KB','MB','GB'];
    var i = 0;
    while (b >= 1024 && i < 3) { b /= 1024; i++; }
    return Math.round(b * 10) / 10 + ' ' + u[i];
}

// ─── RENDER LISTA ──────────────────────────────
function renderList(items) {
    var list = document.getElementById('fileList');
    if (!items.length) {
        list.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><p>Directorio vacío</p></div>';
        return;
    }
    var rows = [];
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var rel = currentPath ? currentPath + '/' + it.name : it.name;
        var actions = '';
        if (it.type === 'dir') {
            actions += '<button class="act-btn" title="Abrir" onclick="loadDir(\'' + esc(rel) + '\')">📂</button>';
        } else {
            actions += '<button class="act-btn" title="Descargar" onclick="downloadFile(\'' + esc(it.name) + '\')">⬇️</button>';
        }
        actions += '<button class="act-btn" title="Renombrar" onclick="promptRename(\'' + esc(it.name) + '\',\'' + it.type + '\')">✏️</button>';
        actions += '<button class="act-btn danger" title="Eliminar" onclick="deleteItem(\'' + esc(it.name) + '\')">🗑️</button>';

        rows.push(
            '<div class="file-item" style="animation-delay:' + (i * 0.03) + 's">' +
            '<span class="fi-icon">' + it.icon + '</span>' +
            '<span class="fi-name" title="' + esc(it.name) + '">' + (it.type === 'dir' ? it.name + '/' : it.name) + '</span>' +
            '<span class="fi-size">' + (it.type === 'file' ? fmtSize(it.size) : '') + '</span>' +
            '<span class="fi-date">' + it.modified + '</span>' +
            '<div class="fi-actions">' + actions + '</div></div>'
        );
    }
    list.innerHTML = rows.join('');
}

// ─── SUBIR ARCHIVOS ──────────────────────────────
function triggerUpload() { document.getElementById('fileInput').click(); }

var dz = document.getElementById('dropZone');
dz.addEventListener('click', function(){ document.getElementById('fileInput').click(); });
dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('active','dragover'); });
dz.addEventListener('dragleave', function(){ dz.classList.remove('dragover'); });
dz.addEventListener('drop', function(e){
    e.preventDefault(); dz.classList.remove('dragover');
    if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});

document.getElementById('fileInput').addEventListener('change', function(){
    if (this.files.length) uploadFiles(this.files);
    this.value = '';
});

function uploadFiles(files) {
    var fd = new FormData();
    for (var i = 0; i < files.length; i++) fd.append('files[]', files[i], files[i].name);
    fd.append('path', currentPath);
    fd.append('action', 'upload');

    document.getElementById('progBar').style.display = 'block';
    var xhr = new XMLHttpRequest();
    xhr.open('POST', API);
    xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) document.getElementById('progFill').style.width = (e.loaded / e.total * 100) + '%';
    };
    xhr.onload = function() {
        document.getElementById('progBar').style.display = 'none';
        try {
            var data = JSON.parse(xhr.responseText);
            if (data.ok) { toast('✅ ' + data.uploaded.length + ' archivo(s) subido(s)'); loadDir(currentPath); }
            else { toast(data.error || 'Error de subida', true); }
        } catch(err) { toast('Respuesta inválida del servidor', true); }
    };
    xhr.send(fd);
}

// ─── DESCARGAR ──────────────────────────────
function downloadFile(name) {
    var rel = currentPath ? currentPath + '/' + name : name;
    window.open(API + '?action=download&path=' + encodeURIComponent(rel), '_blank');
}

// ─── ELIMINAR ──────────────────────────────
function deleteItem(name) {
    if (!confirm('¿Eliminar "' + name + '"?')) return;
    var rel = currentPath ? currentPath + '/' + name : name;
    fetch(API, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'action=delete&path=' + encodeURIComponent(rel) })
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d.ok) { toast('🗑️ Eliminado'); loadDir(currentPath); } else { toast(d.error, true); } });
}

// ─── CREAR CARPETA ──────────────────────────────
function promptMkdir() {
    var name = prompt('Nombre de la carpeta:');
    if (!name) return;
    var rel = currentPath ? currentPath + '/' + name : name;
    fetch(API, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'action=mkdir&path=' + encodeURIComponent(rel) })
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d.ok) { toast('📁 Carpeta creada'); loadDir(currentPath); } else { toast(d.error, true); } });
}

// ─── RENOMBRAR ──────────────────────────────
function promptRename(oldName, type) {
    var newName = prompt('Nuevo nombre para "' + oldName + '":', oldName);
    if (!newName || newName === oldName) return;
    var rel = currentPath ? currentPath + '/' + oldName : oldName;
    fetch(API, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'action=rename&path=' + encodeURIComponent(rel) + '&name=' + encodeURIComponent(newName) })
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d.ok) { toast('✏️ Renombrado'); loadDir(currentPath); } else { toast(d.error, true); } });
}

// ─── INIT ──────────────────────────────
loadDir('');


</script>
</body>
</html>
