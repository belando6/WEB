<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXUS · Documentación</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);--accent:#7c3aed;--accent2:#06b6d4;--text:#e2e8f0;--muted:#94a3b8;--danger:#ef4444}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:2rem 1.5rem;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 50%,rgba(124,58,237,.12) 0%,transparent 60%),radial-gradient(ellipse at 70% 30%,rgba(6,182,212,.08) 0%,transparent 50%);animation:drift 20s ease-in-out infinite alternate;pointer-events:none;z-index:0}
@keyframes drift{to{transform:translate(5%,3%) rotate(2deg)}}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:60px 60px;z-index:0;pointer-events:none}
.header{text-align:center;margin-bottom:2rem;z-index:1;animation:fadeUp .8s ease both}
.logo{font-size:.75rem;letter-spacing:6px;text-transform:uppercase;color:var(--accent2);margin-bottom:.75rem;font-weight:600}
h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;background:linear-gradient(135deg,#fff 30%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:var(--muted);font-size:.95rem;max-width:480px;margin:auto}
.back-link{display:inline-flex;align-items:center;gap:.4rem;color:var(--accent2);text-decoration:none;font-size:.85rem;margin-bottom:1.2rem;transition:opacity .3s}.back-link:hover{opacity:.7}
.container{width:100%;max-width:960px;z-index:1;display:flex;flex-direction:column;gap:1.5rem}
.toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.btn{padding:.6rem 1.2rem;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.9rem;font-weight:600;transition:all .3s;display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{border-color:rgba(124,58,237,.4);box-shadow:0 4px 20px -4px rgba(124,58,237,.2)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
.btn-danger{color:var(--danger);border-color:rgba(239,68,68,.3)}.btn-danger:hover{border-color:var(--danger);box-shadow:0 4px 20px -4px rgba(239,68,68,.2)}
.file-list{display:flex;flex-direction:column;gap:.5rem}
.file-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .3s;animation:fadeUp .5s ease both}
.file-item:hover{border-color:rgba(124,58,237,.4);transform:translateX(4px)}
.file-item.active{border-color:var(--accent);background:rgba(124,58,237,.08)}
.file-info{display:flex;align-items:center;gap:.8rem}
.file-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 12px -2px rgba(124,58,237,.3)}
.file-name{font-weight:600;font-size:.95rem}
.file-meta{color:var(--muted);font-size:.78rem;margin-top:.15rem}
.editor-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:none}
.editor-header{padding:.8rem 1.2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.2)}
.editor-title{font-weight:700;font-size:.95rem;color:var(--accent2)}
.editor-actions{display:flex;gap:.5rem}
.editor-body{padding:1.2rem;max-height:60vh;overflow-y:auto}
.editor-body pre{white-space:pre-wrap;word-break:break-word;font-family:"Cascadia Code","Fira Code",monospace;font-size:.88rem;line-height:1.7;color:#cbd5e1}
textarea.editor-input{width:100%;min-height:40vh;background:rgba(0,0,0,.3);border:none;border-radius:8px;padding:1rem;font-family:"Cascadia Code","Fira Code",monospace;font-size:.88rem;line-height:1.7;color:#e2e8f0;resize:vertical;outline:none}
textarea.editor-input:focus{box-shadow:inset 0 0 0 2px rgba(124,58,237,.3)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#6ee7b7;padding:.7rem 1.4rem;border-radius:10px;font-size:.85rem;z-index:99;animation:fadeUp .3s ease both}
.toast.error{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:#fca5a5}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.file-item{padding:.8rem}.editor-body{max-height:50vh}}
</style>
</head>
<body>
<div class="grid-bg"></div>

<header class="header">
  <a href="../index.html" class="back-link">&#8592; Volver al Portal</a>
  <p class="logo">NEXUS · Documentación</p>
  <h1>Gestor de Documentos</h1>
  <p class="subtitle">Visualiza, edita y gestiona los archivos del proyecto. Un clic para abrir, otro para guardar.</p>
</header>

<div class="container">
  <div class="toolbar">
    <button class="btn btn-primary" onclick="createFile()">+ Nuevo archivo</button>
    <span id="fileCount" style="color:var(--muted);font-size:.85rem"></span>
  </div>

  <div class="file-list" id="fileList"></div>

  <div class="editor-panel" id="editorPanel">
    <div class="editor-header">
      <span class="editor-title" id="editorTitle"></span>
      <div class="editor-actions">
        <button class="btn" onclick="toggleEdit()" id="editToggleBtn">&#9998; Editar</button>
        <button class="btn btn-primary" onclick="saveFile()" id="saveBtn" style="display:none">&#128190; Guardar</button>
        <button class="btn btn-danger" onclick="deleteFile()">&#128465; Borrar</button>
      </div>
    </div>
    <div class="editor-body" id="editorBody"></div>
  </div>
</div>

<script>
let files=[],currentFile=null,editMode=false,currentContent="";

async function api(action,params){
  params=params||{};
  let url="api.php?action="+action;
  if(params.query)for(const[k,v]of Object.entries(params.query))url+="&"+k+"="+encodeURIComponent(v);
  const opts={method:params.body?"POST":"GET"};
  if(params.body){opts.headers={"Content-Type":"application/json"};opts.body=JSON.stringify(params.body)}
  const r=await fetch(url,opts);return r.json();
}

async function loadFiles(){
  const d=await api("list");if(!d.ok)return;files=d.files;renderList();
  document.getElementById("fileCount").textContent=files.length+" archivo(s)";
}

function renderList(){
  const el=document.getElementById("fileList");
  if(!files.length){el.innerHTML="<p style='color:var(--muted);text-align:center;padding:1rem'>No hay archivos .md o .txt</p>";return}
  let html="";
  for(const f of files){
    const active=currentFile===f.name?"active":"";
    const icons={md:'&#128221;',txt:'&#128196;',json:'&#128205;',js:'&#9889;',css:'&#127912;',png:'&#128444;',jpg:'&#128444;',gif:'&#128444;',svg:'&#128444;',pdf:'&#128196;',zip:'&#128230;',sh:'&#128187;'};const icon=icons[f.ext]||'&#128196;';
    html+="<div class='file-item "+active+"' data-file='"+f.name+"'>"
      +"<div class='file-info'><div class='file-icon'>"+icon+"</div>"
      +"<div><div class='file-name'>"+escHtml(f.name)+"</div><div class='file-meta'>"+fmtSize(f.size)+" \u00b7 "+f.lines+" l\u00edneas \u00b7 Mod: "+f.modified+"</div></div></div></div>";
  }
  el.innerHTML=html;
}

document.getElementById("fileList").addEventListener("click",function(e){
  const item=e.target.closest(".file-item");
  if(item)openFile(item.dataset.file);
});

function fmtSize(b){if(b<1024)return b+" B";return(b/1024).toFixed(1)+" KB"}

async function openFile(name){
  currentFile=name;editMode=false;renderList();
  const d=await api("read",{query:{file:name}});
  if(!d.ok){toast(d.error||"Error",true);return}
  currentContent=d.content;
  document.getElementById("editorTitle").textContent=d.name;
  showView(currentContent);
  document.getElementById("editorPanel").style.display="block";
}

function showView(content){
  const body=document.getElementById("editorBody");
  body.innerHTML="<pre>"+escHtml(content)+"</pre>";
  document.getElementById("editToggleBtn").innerHTML="&#9998; Editar";
  document.getElementById("saveBtn").style.display="none";
}

function toggleEdit(){
  editMode=!editMode;
  const body=document.getElementById("editorBody");
  if(editMode){
    body.innerHTML="<textarea class='editor-input' id='editArea'>"+escHtml(currentContent)+"</textarea>";
    document.getElementById("saveBtn").style.display="";
    document.getElementById("editToggleBtn").innerHTML="&#128065; Ver";
  }else{
    showView(currentContent);
    document.getElementById("saveBtn").style.display="none";
    document.getElementById("editToggleBtn").innerHTML="&#9998; Editar";
  }
}

async function saveFile(){
  const content=document.getElementById("editArea").value;
  const d=await api("save",{body:{file:currentFile,content}});
  if(d.ok){toast("\u2705 "+d.saved+" guardado")}else{toast(d.error||"Error",true)}
  currentContent=content;showView(content);loadFiles();
}

async function deleteFile(){
  if(!confirm("¿Borrar "+currentFile+"?"))return;
  const d=await api("delete",{query:{file:currentFile}});
  if(d.ok){toast("\u{1F5D1} "+d.deleted+" eliminado");currentFile=null;document.getElementById("editorPanel").style.display="none";loadFiles()}
  else toast(d.error||"Error",true);
}

async function createFile(){
  const name=prompt("Nombre del archivo (ej: notas.md):");
  if(!name)return;
  const fname=name.includes(".")?name:name+".md";
  const d=await api("create",{body:{file:fname,content:""}});
  if(d.ok){toast("\u2705 "+d.created+" creado");loadFiles();openFile(fname)}
  else toast(d.error||"Error",true);
}

function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function toast(msg,err){
  const el=document.createElement("div");el.className="toast"+(err?" error":"");el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),3000);
}

loadFiles();
</script>
</body>
</html>
