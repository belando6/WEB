<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXUS · Chat de Sesiones</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);--accent:#7c3aed;--accent2:#06b6d4;--text:#e2e8f0;--muted:#94a3b8}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:64px;background:rgba(10,10,26,.95);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.5rem;gap:1rem;z-index:10}
.topbar .logo{font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--accent2);font-weight:600}
.topbar h1{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.back-link{color:var(--accent2);text-decoration:none;font-size:.85rem;padding:.4rem .8rem;border-radius:8px;background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.2)}
.app{display:flex;flex:1;min-height:0}
.sidebar{width:300px;min-width:240px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:rgba(10,10,26,.6);overflow-y:auto}
.sidebar-header{padding:1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.sidebar-header h3{font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.new-btn{padding:.5rem 1rem;border-radius:8px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:.8rem;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s}
.new-btn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(124,58,237,.4)}
.session-list{flex:1;padding:.5rem;overflow-y:auto}
.session-item{padding:.8rem 1rem;border-radius:10px;cursor:pointer;margin-bottom:.3rem;display:flex;align-items:center;gap:.6rem;transition:background .2s,border-color .2s;border:1px solid transparent}
.session-item:hover{background:rgba(124,58,237,.08)}
.session-item.active{background:rgba(124,58,237,.15);border-color:rgba(124,58,237,.3)}
.s-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.s-info{flex:1;min-width:0}
.s-name{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-meta{font-size:.7rem;color:var(--muted)}
.s-del{opacity:0;width:24px;height:24px;border-radius:6px;border:none;background:rgba(239,68,68,.15);color:#ef4444;cursor:pointer;font-size:.75rem;transition:opacity .2s}
.session-item:hover .s-del{opacity:1}
.chat-area{flex:1;display:flex;flex-direction:column;min-height:0;background:rgba(10,10,26,.3)}
.messages-container{flex:1;overflow-y:auto;padding:1.5rem 2rem;display:flex;flex-direction:column;gap:.8rem}
.msg{max-width:75%;padding:.9rem 1.2rem;border-radius:14px;font-size:.9rem;line-height:1.6;position:relative;word-break:break-word;white-space:pre-wrap;animation:msgIn .3s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-text{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text)}
.msg-file{background:rgba(6,182,212,.06);border-color:rgba(6,182,212,.2);display:flex;align-items:center;gap:.7rem}
.f-icon{font-size:1.5rem}
.msg-file a{color:var(--accent2);text-decoration:none;font-weight:600}
.msg-meta{font-size:.68rem;color:var(--muted);margin-top:.4rem;display:flex;gap:.8rem;align-items:center}
.copy-btn{padding:.25rem .6rem;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--muted);font-size:.7rem;cursor:pointer;transition:all .2s}
.copy-btn:hover{background:rgba(124,58,237,.2);border-color:var(--accent);color:#fff}
.del-msg{opacity:0;width:20px;height:20px;border-radius:4px;border:none;background:rgba(239,68,68,.1);color:#ef4444;font-size:.7rem;cursor:pointer;transition:opacity .2s}
.msg:hover .del-msg{opacity:1}
.input-area{padding:1rem 1.5rem;border-top:1px solid var(--border);background:rgba(10,10,26,.8)}
.paste-bar{display:flex;gap:.5rem;margin-bottom:.7rem}
.paste-btn{flex:1;padding:.7rem 1rem;border-radius:10px;border:2px dashed rgba(124,58,237,.4);background:rgba(124,58,237,.06);color:var(--accent2);font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.paste-btn:hover{border-color:var(--accent);background:rgba(124,58,237,.12)}
.input-row{display:flex;gap:.6rem;align-items:flex-end}
textarea.msg-input{flex:1;height:80px;resize:none;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);padding:.9rem 1.2rem;font-size:.9rem;font-family:inherit;line-height:1.5;outline:none;transition:border-color .2s}
textarea.msg-input:focus{border-color:var(--accent)}
.actions-col{display:flex;flex-direction:column;gap:.4rem}
.file-btn,.send-btn{padding:.6rem 1rem;border-radius:8px;border:none;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.file-btn{background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.3);color:var(--accent2)}
.send-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.send-btn:hover{transform:scale(1.03);box-shadow:0 4px 16px rgba(124,58,237,.4)}
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.9rem;padding:2rem}
.e-icon{font-size:3rem;margin-bottom:1rem;opacity:.4}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#1a1a2e;border:1px solid var(--border);border-radius:16px;padding:2rem;width:min(400px,90vw)}
.modal h3{margin-bottom:1rem;font-size:1.1rem}
.modal input{width:100%;padding:.8rem 1rem;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:.9rem;outline:none;margin-bottom:1rem}
.modal-actions{display:flex;gap:.6rem;justify-content:flex-end}
.btn-cancel{padding:.6rem 1.2rem;border-radius:8px;border:none;background:rgba(255,255,255,.08);color:var(--muted);font-weight:600;cursor:pointer}
.btn-confirm{padding:.6rem 1.2rem;border-radius:8px;border:none;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
@media(max-width:768px){.sidebar{width:100%;max-height:180px}.app{flex-direction:column;height:auto;overflow-y:auto}.messages-container{padding:1rem}.msg{max-width:95%}}
</style>
</head>
<body>
<div class="topbar">
  <a href="../index.html" class="back-link">← Menú</a>
  <span class="logo">NEXUS</span>
  <h1>Chat de Sesiones</h1>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3>Sesiones</h3>
      <button class="new-btn" onclick="openNewSession()">+ Nueva</button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <main class="chat-area">
    <div class="messages-container" id="messagesContainer">
      <div class="empty-state"><div><div class="e-icon">💬</div>Selecciona o crea una sesión para empezar.<br>Pega texto directamente desde tu portapapeles.</div></div>
    </div>
    <div class="input-area" id="inputArea" style="display:none">
      <div class="paste-bar">
        <button class="paste-btn" onclick="pasteFromClipboard()">📋 Pegar del Portapapeles (Ctrl+V)</button>
      </div>
      <div class="input-row">
        <textarea class="msg-input" id="msgInput" placeholder="Escribe o pega aquí tu texto... (Enter = enviar, Shift+Enter = nueva línea)"></textarea>
        <div class="actions-col">
          <button class="file-btn" onclick="document.getElementById('fileInput').click()">📎 Archivo</button>
          <input type="file" id="fileInput" hidden multiple>
          <button class="send-btn" onclick="sendMessage()">Enviar ➤</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="newSessionModal" style="display:none">
  <div class="modal">
    <h3>Nueva Sesión</h3>
    <input type="text" id="sessionNameInput" placeholder="Nombre de la sesión..." onkeydown="if(event.key==='Enter')createSession()">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" onclick="createSession()">Crear</button>
    </div>
  </div>
</div>

<script>
let currentSession = null;
const API = 'api.php';

function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

async function api(action, data={}){
  const fd = new FormData();
  fd.append('action', action);
  for(const [k,v] of Object.entries(data)) fd.append(k,v);
  const r = await fetch(API,{method:'POST',body:fd});
  return r.json();
}

async function loadSessions(){
  const d=await api('list_sessions');
  if(!d.ok)return;
  document.getElementById('sessionList').innerHTML=d.sessions.map(s=>{
    const active = currentSession===s.id ? 'active' : '';
    const initial = (s.name[0]||'?').toUpperCase();
    return '<div class="session-item '+active+'" onclick="selectSession('+s.id+')">' +
      '<div class="s-icon">'+initial+'</div>' +
      '<div class="s-info"><div class="s-name">'+esc(s.name)+'</div><div class="s-meta">'+(s.msg_count||0)+' msg · '+(s.created_at?s.created_at.slice(5,16):'')+'</div></div>' +
      '<button class="s-del" onclick="event.stopPropagation();deleteSession('+s.id+')">✕</button></div>';
  }).join('');
}

function selectSession(id){
  currentSession=id;
  document.getElementById('inputArea').style.display='block';
  loadSessions();
  loadMessages2();
}

async function loadMessages2(){
  const d=await api('get_messages',{session_id:currentSession});
  if(!d.ok)return;
  _msgCache=d.messages;
  const c=document.getElementById('messagesContainer');
  if(!d.messages.length){c.innerHTML='<div class="empty-state"><div><div class="e-icon">📭</div>Sesión vacía. Pega o escribe algo.</div></div>';return;}
  c.innerHTML=d.messages.map((m,i)=>{
    const ts=m.created_at?m.created_at.slice(5,16):'';
    if(m.type==='file'){
      const sz=m.file_size>1048576?(m.file_size/1048576).toFixed(1)+' MB':Math.round(m.file_size/1024)+' KB';
      return '<div class="msg msg-file"><span class="f-icon">📄</span><a href="uploads/'+esc(m.filename)+'" target="_blank">'+esc(m.filename)+'</a>' +
        '<div class="msg-meta"><span>'+sz+'</span><span>'+ts+'</span><button class="del-msg" onclick="deleteMsg('+m.id+')">✕</button></div></div>';
    }
    return '<div class="msg msg-text">'+esc(m.content) +
      '<div class="msg-meta"><span>'+ts+'</span>' +
      '<button class="copy-btn" data-idx="'+i+'" onclick="copyMsg(this)">📋 Copiar</button>' +
      '<button class="del-msg" onclick="deleteMsg('+m.id+')">✕</button></div></div>';
  }).join('');
  c.scrollTop=c.scrollHeight;
}

function copyMsg(btn){
  const idx=parseInt(btn.dataset.idx);
  if(_msgCache[idx]) navigator.clipboard.writeText(_msgCache[idx].content).then(()=>{btn.textContent='✓ Copiado';setTimeout(()=>btn.textContent='📋 Copiar',1500);});
}

async function sendMessage(){
  const inp=document.getElementById('msgInput');const t=inp.value.trim();if(!t||!currentSession)return;
  await api('add_message',{session_id:currentSession,content:t});
  inp.value='';loadMessages2();loadSessions();
}

function pasteFromClipboard(){
  navigator.clipboard.readText().then(t=>{document.getElementById('msgInput').value=t;}).catch(()=>{});
}

async function deleteMsg(id){await api('delete_message',{message_id:id});loadMessages2();loadSessions();}
async function deleteSession(id){if(!confirm('¿Eliminar sesión y todos sus mensajes?'))return;await api('delete_session',{id});currentSession=null;document.getElementById('inputArea').style.display='none';loadSessions();}

function openNewSession(){document.getElementById('newSessionModal').style.display='flex';document.getElementById('sessionNameInput').focus();}
function closeModal(){document.getElementById('newSessionModal').style.display='none';}
async function createSession(){const n=document.getElementById('sessionNameInput').value.trim();if(!n)return;const d=await api('create_session',{name:n});closeModal();loadSessions();if(d.ok)selectSession(d.id);}

document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
document.getElementById('fileInput').addEventListener('change',async function(){
  if(!this.files.length||!currentSession)return;
  for(const f of this.files){const fd=new FormData();fd.append('action','upload_file');fd.append('session_id',currentSession);fd.append('file',f);await fetch(API,{method:'POST',body:fd});}
  this.value='';loadMessages2();loadSessions();
});

loadSessions();
</script>
</body>
</html>
